# Configuración de Cloudflare Pages para centro-camionero.
# Al existir este archivo, Cloudflare toma de aquí los enlaces (bindings) de la base de datos
# y del almacenamiento de fotos, para producción y vista previa.
name = "centro-camionero"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "centro-camionero-db"
database_id = "27b99440-34c9-437f-ab1d-c4b223427967"

[[kv_namespaces]]
binding = "FOTOS"
id = "f5f164a47f114fc58b4ed3d04941b687"
